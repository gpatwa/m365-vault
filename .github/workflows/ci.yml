name: CI

on:
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Verify imports
        run: |
          cd backend
          python -c "from app.config import settings; print(f'Config OK: {settings.APP_NAME} v{settings.APP_VERSION}')"
          python -c "from app.services.storage_factory import create_storage_backend; print('Storage factory OK')"
          python -c "from app.services.compression import compression_service; print('Compression OK')"

      - name: Build Docker image
        run: docker build -t m365vault-backend:test ./backend

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install & build
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Build Docker image
        run: docker build -t m365vault-frontend:test ./frontend

  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9"

      - name: Terraform init & validate
        run: |
          cd infra
          terraform init -backend=false
          terraform validate
