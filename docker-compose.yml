services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: m365vault
      POSTGRES_USER: m365vault
      POSTGRES_PASSWORD: m365vault_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U m365vault"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/m365vault-backups;
      echo 'Bucket m365vault-backups ready';
      "

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    platform: linux/amd64
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://m365vault:m365vault_dev@postgres:5432/m365vault
      STORAGE_BACKEND: minio
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: m365vault-backups
      MINIO_USE_SSL: "false"
      SECRET_KEY: docker-dev-secret-change-in-production-32
      ENCRYPTION_MASTER_KEY: docker-dev-32-byte-master-key!!
      REDIS_URL: redis://redis:6379
      DISPATCH_MODE: redis
      DEBUG: "true"
    volumes:
      - ./scripts:/scripts

  worker:
    build: ./backend
    platform: linux/amd64
    command: python -m app.worker
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://m365vault:m365vault_dev@postgres:5432/m365vault
      STORAGE_BACKEND: minio
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: m365vault-backups
      MINIO_USE_SSL: "false"
      ENCRYPTION_MASTER_KEY: docker-dev-32-byte-master-key!!
      REDIS_URL: redis://redis:6379
      DISPATCH_MODE: redis
      DEBUG: "true"
      DISPATCH_MODE: redis
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./scripts:/scripts

  worker:
    build: ./backend
    platform: linux/amd64
    command: ["python", "-m", "app.worker"]
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://m365vault:m365vault_dev@postgres:5432/m365vault
      STORAGE_BACKEND: minio
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: m365vault-backups
      MINIO_USE_SSL: "false"
      SECRET_KEY: docker-dev-secret-change-in-production-32
      ENCRYPTION_MASTER_KEY: docker-dev-32-byte-master-key!!
      DISPATCH_MODE: redis
      REDIS_URL: redis://redis:6379/0
      WORKER_CONCURRENCY: "3"

  frontend:
    build: ./frontend
    platform: linux/amd64
    ports:
      - "5173:80"
    environment:
      BACKEND_URL: http://localhost:8000
    depends_on:
      - backend

volumes:
  pgdata:
  miniodata:
